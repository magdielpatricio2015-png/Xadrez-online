<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xadrez Online Leve</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #111827;
  font-family: Arial, Helvetica, sans-serif;
  padding: 10px;
}

.app {
  max-width: 720px;
  margin: auto;
}

h1 {
  margin: 10px 0 4px;
  font-size: 30px;
}

p {
  color: #64748b;
}

.card {
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 16px;
  padding: 12px;
  margin: 12px 0;
  box-shadow: 0 6px 18px rgba(0,0,0,.08);
}

#status {
  font-size: 18px;
  font-weight: bold;
}

.pill {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  background: #e0f2fe;
  color: #075985;
  margin: 4px 4px 0 0;
  font-size: 14px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button, input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  font-size: 16px;
  margin-top: 8px;
}

button {
  border: 0;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

button.green { background: #16a34a; }
button.gray { background: #475569; }
button.red { background: #dc2626; }

#board {
  width: min(94vw, 620px);
  aspect-ratio: 1 / 1;
  margin: 14px auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 4px solid #1f2937;
  border-radius: 12px;
  overflow: hidden;
  background: #f8fafc;
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(30px, 9vw, 58px);
  cursor: pointer;
  user-select: none;
  position: relative;
}

.light {
  background: #f8fafc;
}

.dark {
  background: #94a3b8;
}

.selected {
  outline: 4px solid #facc15;
  outline-offset: -4px;
}

.legal::after {
  content: "";
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: rgba(22,163,74,.55);
  position: absolute;
}

.last {
  box-shadow: inset 0 0 0 4px rgba(37,99,235,.45);
}

.moves {
  background: #f8fafc;
  padding: 10px;
  border-radius: 12px;
  min-height: 60px;
  max-height: 150px;
  overflow: auto;
  white-space: pre-wrap;
  font-family: monospace;
}
</style>
</head>

<body>
<div class="app">
  <h1>♟️ Xadrez Online</h1>
  <p>Tabuleiro leve. Funciona primeiro no modo local. O online carrega só quando você clicar.</p>

  <div class="card">
    <div id="status">Carregando...</div>
    <span id="turno" class="pill">Turno: brancas</span>
    <span id="modo" class="pill">Modo: local</span>
    <span id="conexao" class="pill">Offline</span>
  </div>

  <div class="card">
    <div class="row">
      <button class="green" onclick="novoJogo(true)">Novo jogo</button>
      <button class="gray" onclick="girar()">Girar</button>
    </div>
    <div class="row">
      <button class="gray" onclick="desfazer(true)">Desfazer</button>
      <button class="red" onclick="sairOnline()">Sair online</button>
    </div>
  </div>

  <div id="board"></div>

  <div class="card">
    <h2>Jogar online</h2>
    <p>Um jogador cria a sala. O outro abre o link e clica em entrar.</p>

    <div class="row">
      <button onclick="criarSala()">Criar sala</button>
      <button class="green" onclick="entrarSala()">Entrar</button>
    </div>

    <input id="codigo" placeholder="Código da sala">
    <button class="gray" onclick="copiarLink()">Copiar link da sala</button>
  </div>

  <div class="card">
    <h2>Lances</h2>
    <div id="moves" class="moves">Nenhum lance.</div>
  </div>
</div>

<script>
const simbolos = {
  r:"♜", n:"♞", b:"♝", q:"♛", k:"♚", p:"♟",
  R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔", P:"♙"
};

let board = [];
let turno = "w";
let selecionada = null;
let historico = [];
let ultimo = null;
let invertido = false;

let peer = null;
let conn = null;
let online = false;
let minhaCor = null;
let peerjsCarregado = false;

function inicial() {
  return [
    ["r","n","b","q","k","b","n","r"],
    ["p","p","p","p","p","p","p","p"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["P","P","P","P","P","P","P","P"],
    ["R","N","B","Q","K","B","N","R"]
  ];
}

function novoJogo(enviar) {
  board = inicial();
  turno = "w";
  selecionada = null;
  historico = [];
  ultimo = null;
  render();
  status();

  if (enviar && online && conn && conn.open) {
    conn.send({tipo:"novo"});
  }
}

function cor(p) {
  if (!p) return null;
  return p === p.toUpperCase() ? "w" : "b";
}

function dentro(r,c) {
  return r >= 0 && r < 8 && c >= 0 && c < 8;
}

function livre(r1,c1,r2,c2) {
  const dr = Math.sign(r2-r1);
  const dc = Math.sign(c2-c1);
  let r = r1 + dr;
  let c = c1 + dc;

  while (r !== r2 || c !== c2) {
    if (board[r][c]) return false;
    r += dr;
    c += dc;
  }

  return true;
}

function valido(r1,c1,r2,c2) {
  if (!dentro(r1,c1) || !dentro(r2,c2)) return false;

  const p = board[r1][c1];
  const alvo = board[r2][c2];

  if (!p) return false;
  if (cor(p) !== turno) return false;
  if (alvo && cor(alvo) === turno) return false;

  const tipo = p.toLowerCase();
  const dr = r2-r1;
  const dc = c2-c1;
  const ar = Math.abs(dr);
  const ac = Math.abs(dc);
  const lado = cor(p);
  const dir = lado === "w" ? -1 : 1;
  const linhaInicial = lado === "w" ? 6 : 1;

  if (tipo === "p") {
    if (dc === 0 && !alvo && dr === dir) return true;
    if (dc === 0 && !alvo && r1 === linhaInicial && dr === 2*dir && !board[r1+dir][c1]) return true;
    if (ac === 1 && dr === dir && alvo && cor(alvo) !== lado) return true;
    return false;
  }

  if (tipo === "r") return (dr === 0 || dc === 0) && livre(r1,c1,r2,c2);
  if (tipo === "b") return ar === ac && livre(r1,c1,r2,c2);
  if (tipo === "q") return ((dr === 0 || dc === 0) || ar === ac) && livre(r1,c1,r2,c2);
  if (tipo === "n") return (ar === 2 && ac === 1) || (ar === 1 && ac === 2);
  if (tipo === "k") return ar <= 1 && ac <= 1;

  return false;
}

function legais(r,c) {
  const out = [];
  for (let r2=0; r2<8; r2++) {
    for (let c2=0; c2<8; c2++) {
      if (valido(r,c,r2,c2)) out.push([r2,c2]);
    }
  }
  return out;
}

function podeJogar() {
  if (!online) return true;
  return minhaCor === turno;
}

function clicar(r,c) {
  if (!podeJogar()) {
    document.getElementById("status").textContent = "Não é sua vez.";
    return;
  }

  const p = board[r][c];

  if (!selecionada) {
    if (!p) return;
    if (cor(p) !== turno) return;

    selecionada = [r,c];
    render();
    return;
  }

  const r1 = selecionada[0];
  const c1 = selecionada[1];

  if (r1 === r && c1 === c) {
    selecionada = null;
    render();
    return;
  }

  if (valido(r1,c1,r,c)) {
    mover(r1,c1,r,c,true);
  } else if (p && cor(p) === turno) {
    selecionada = [r,c];
    render();
  }
}

function mover(r1,c1,r2,c2,enviar) {
  const p = board[r1][c1];
  const capturou = board[r2][c2];

  historico.push({
    board: JSON.stringify(board),
    turno: turno,
    texto: casa(r1,c1) + "-" + casa(r2,c2) + (capturou ? "x" : "")
  });

  board[r2][c2] = p;
  board[r1][c1] = "";

  if (p === "P" && r2 === 0) board[r2][c2] = "Q";
  if (p === "p" && r2 === 7) board[r2][c2] = "q";

  turno = turno === "w" ? "b" : "w";
  selecionada = null;
  ultimo = [[r1,c1],[r2,c2]];

  render();
  status();

  if (enviar && online && conn && conn.open) {
    conn.send({tipo:"mover", r1, c1, r2, c2});
  }
}

function casa(r,c) {
  return String.fromCharCode(97+c) + (8-r);
}

function render() {
  const el = document.getElementById("board");
  el.innerHTML = "";

  let casas = [];
  for (let r=0; r<8; r++) {
    for (let c=0; c<8; c++) {
      casas.push([r,c]);
    }
  }

  if (invertido) casas.reverse();

  const listaLegais = selecionada ? legais(selecionada[0], selecionada[1]) : [];

  for (const par of casas) {
    const r = par[0];
    const c = par[1];

    const d = document.createElement("div");
    d.className = "square " + ((r+c)%2===0 ? "light" : "dark");

    const p = board[r][c];
    d.textContent = p ? simbolos[p] : "";

    if (selecionada && selecionada[0] === r && selecionada[1] === c) {
      d.classList.add("selected");
    }

    if (listaLegais.some(x => x[0]===r && x[1]===c)) {
      d.classList.add("legal");
    }

    if (ultimo) {
      const a = ultimo[0];
      const b = ultimo[1];
      if ((a[0]===r && a[1]===c) || (b[0]===r && b[1]===c)) {
        d.classList.add("last");
      }
    }

    d.onclick = () => clicar(r,c);
    el.appendChild(d);
  }

  lances();
}

function status() {
  document.getElementById("status").textContent =
    turno === "w" ? "Vez das brancas" : "Vez das pretas";

  document.getElementById("turno").textContent =
    turno === "w" ? "Turno: brancas" : "Turno: pretas";

  document.getElementById("modo").textContent =
    online ? ("Você: " + (minhaCor === "w" ? "brancas" : "pretas")) : "Modo: local";

  document.getElementById("conexao").textContent =
    online && conn && conn.open ? "Online" : "Offline";
}

function lances() {
  document.getElementById("moves").textContent =
    historico.map((h,i)=> (i+1) + ". " + h.texto).join("\n") || "Nenhum lance.";
}

function desfazer(enviar) {
  const ult = historico.pop();
  if (!ult) return;

  board = JSON.parse(ult.board);
  turno = ult.turno;
  selecionada = null;
  ultimo = null;

  render();
  status();

  if (enviar && online && conn && conn.open) {
    conn.send({tipo:"desfazer"});
  }
}

function girar() {
  invertido = !invertido;
  render();
}

function carregarPeerJS(callback) {
  if (peerjsCarregado) {
    callback();
    return;
  }

  const s = document.createElement("script");
  s.src = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
  s.onload = () => {
    peerjsCarregado = true;
    callback();
  };
  s.onerror = () => {
    alert("Não foi possível carregar o modo online. O modo local continua funcionando.");
  };
  document.body.appendChild(s);
}

function criarSala() {
  carregarPeerJS(() => {
    if (peer) peer.destroy();

    peer = new Peer();

    peer.on("open", id => {
      online = true;
      minhaCor = "w";
      document.getElementById("codigo").value = id;
      status();
      alert("Sala criada. Copie o link e envie para seu amigo.");
    });

    peer.on("connection", c => {
      conn = c;
      configurarConn();

      conn.on("open", () => {
        conn.send({tipo:"sync", board, turno, historico});
        status();
        alert("Amigo conectado.");
      });
    });

    peer.on("error", e => alert("Erro online: " + e));
  });
}

function entrarSala() {
  carregarPeerJS(() => {
    const params = new URLSearchParams(location.search);
    const id = document.getElementById("codigo").value.trim() || params.get("sala");

    if (!id) {
      alert("Digite o código da sala ou abra o link recebido.");
      return;
    }

    if (peer) peer.destroy();

    peer = new Peer();

    peer.on("open", () => {
      online = true;
      minhaCor = "b";
      conn = peer.connect(id);
      configurarConn();
      status();
    });

    peer.on("error", e => alert("Erro online: " + e));
  });
}

function configurarConn() {
  conn.on("open", () => status());

  conn.on("data", d => {
    if (d.tipo === "mover") mover(d.r1,d.c1,d.r2,d.c2,false);
    if (d.tipo === "novo") novoJogo(false);
    if (d.tipo === "desfazer") desfazer(false);
    if (d.tipo === "sync") {
      board = d.board;
      turno = d.turno;
      historico = d.historico || [];
      selecionada = null;
      render();
      status();
    }
  });

  conn.on("close", () => {
    online = false;
    conn = null;
    status();
    alert("Conexão encerrada.");
  });
}

function copiarLink() {
  const id = document.getElementById("codigo").value.trim();

  if (!id) {
    alert("Crie uma sala primeiro.");
    return;
  }

  const link = location.origin + location.pathname + "?sala=" + encodeURIComponent(id);

  if (navigator.clipboard) {
    navigator.clipboard.writeText(link)
      .then(() => alert("Link copiado. Envie para seu amigo."))
      .catch(() => prompt("Copie o link:", link));
  } else {
    prompt("Copie o link:", link);
  }
}

function sairOnline() {
  online = false;
  minhaCor = null;

  if (conn) conn.close();
  if (peer) peer.destroy();

  conn = null;
  peer = null;
  status();
}

window.addEventListener("load", () => {
  novoJogo(false);

  const sala = new URLSearchParams(location.search).get("sala");
  if (sala) {
    document.getElementById("codigo").value = sala;
  }
});
</script>
</body>
</html>
